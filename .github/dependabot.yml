# 上游镜像发新版时开 PR，标签和摘要一起改；PR 跑插件自己的检查。
# 镜像里带 InfluxDB 和 SQLite，跨大版本会跑数据库迁移：major 升级不自动开 PR，由人核对迁移说明
# （0.x 阶段这只挡 0.x→1.x，0.x 内部的升级仍要在 PR 里读 release notes 确认）。
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
